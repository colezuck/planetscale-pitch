<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 450" role="img" aria-labelledby="intercom-story-title intercom-story-desc">
  <title id="intercom-story-title">Intercom’s Inbox bottleneck and previous workaround</title>
  <desc id="intercom-story-desc">A simplified illustration of Intercom’s published Vitess/MySQL story, not its complete topology. At peak load, database replicas reached provisioned IOPS limits on EBS gp3, slowing the Inbox. The next reveal shows added replica capacity and EBS io2, providing more headroom at higher cost. The replica stack and request blocks are schematic, not measured counts.</desc>
  <defs>
    <pattern id="intercom-pain-dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="1.3" height="2.4" fill="#ff4d4d"/>
      <rect x="4.5" y="4.5" width="1.3" height="2.4" fill="#ff4d4d"/>
    </pattern>
    <pattern id="intercom-server-dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="1.3" height="2.4" fill="#777777"/>
      <rect x="4.5" y="4.5" width="1.3" height="2.4" fill="#777777"/>
    </pattern>
    <marker id="intercom-arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a5a5a5"/></marker>
    <marker id="intercom-arrow-flow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path class="intercom-flow-head" d="M0 0L7 3.5L0 7Z" fill="#ff4d4d"/></marker>
    <g id="intercom-inbox" fill="none" stroke="#dadada" stroke-width="1.5">
      <rect x="16" y="112" width="298" height="206" fill="#151515"/>
      <path d="M16 171H314" stroke="#666666"/>
      <rect x="45" y="195" width="36" height="24"/>
      <path d="M99 198H277M99 214H232"/>
      <rect x="45" y="237" width="36" height="24"/>
      <path d="M99 240H252M99 256H277"/>
      <rect x="45" y="279" width="36" height="24"/>
      <path d="M99 282H277M99 298H207"/>
    </g>
    <g id="intercom-replica" fill="none" stroke="#dadada" stroke-width="1.5">
      <rect x="455" y="112" width="312" height="206" fill="#151515"/>
      <rect x="463" y="120" width="296" height="190" stroke="#555555"/>
      <rect x="485" y="190" width="252" height="30" fill="#111111"/>
      <rect x="485" y="232" width="252" height="30" fill="#111111"/>
      <rect x="485" y="274" width="252" height="30" fill="#111111"/>
      <path d="M503 201H513M503 243H513M503 285H513"/>
      <path d="M703 201H719M703 243H719M703 285H719" stroke="#777777"/>
    </g>
    <g id="intercom-storage-icon" fill="none" stroke="#dadada" stroke-width="1.5">
      <rect x="1080" y="201" width="70" height="88"/>
      <path d="M1092 214H1138M1092 228H1138M1092 242H1128M1092 256H1138M1092 270H1138"/>
    </g>
  </defs>
  <g class="intercom-added-capacity" fill="#151515" stroke="#777777" stroke-width="1.5" aria-hidden="true">
    <rect x="435" y="80" width="312" height="206"/>
    <rect x="445" y="96" width="312" height="206"/>
  </g>
  <g class="intercom-shared-art" font-family="Inter,Arial,sans-serif">
    <use href="#intercom-inbox"/>
    <text x="165" y="151" text-anchor="middle" fill="#fafafa" font-size="31" font-weight="500">Inbox</text>
    <path d="M327 216H439" fill="none" stroke="#a5a5a5" stroke-width="1.8" stroke-dasharray="10 8" marker-end="url(#intercom-arrow-gray)"/>
    <use href="#intercom-replica"/>
    <rect class="intercom-storage-back" x="999" y="122" width="235" height="206" fill="none" stroke="#666666" stroke-width="1.5"/>
    <rect class="intercom-storage-front" x="989" y="112" width="235" height="206" fill="#151515" stroke="#dadada" stroke-width="1.5"/>
    <rect class="intercom-storage-stipple" x="997" y="120" width="219" height="190" fill="url(#intercom-server-dots)" opacity=".35"/>
    <rect class="intercom-storage-mask" x="1012" y="141" width="189" height="164" fill="#151515"/>
    <use href="#intercom-storage-icon"/>
    <path class="intercom-storage-flow" d="M781 207H970M970 261H781" fill="none" stroke="#ff4d4d" stroke-width="1.8" marker-end="url(#intercom-arrow-flow)"/>
    <rect x="16" y="368" width="1218" height="66" fill="url(#intercom-pain-dots)" stroke="#ff4d4d" stroke-opacity=".45" fill-opacity=".23"/>
    <rect x="290" y="383" width="670" height="37" fill="#111111"/>
  </g>
  <g class="intercom-original-art" font-family="Inter,Arial,sans-serif">
    <text x="611" y="164" text-anchor="middle" fill="#fafafa" font-size="29" font-weight="500">Database replica</text>
    <text x="1107" y="164" text-anchor="middle" fill="#fafafa" font-size="30" font-weight="500">EBS gp3</text>
    <text x="877" y="145" text-anchor="middle" fill="#ff4d4d" font-size="25" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">IOPS limit</text>
    <path d="M99 198H277M99 214H232" fill="none" stroke="#ff4d4d" stroke-width="2"/>
    <path d="M955 186V226" fill="none" stroke="#ff4d4d" stroke-width="4"/>
    <g class="intercom-request-queue" fill="#111111" stroke="#ff4d4d" stroke-width="1.8">
      <rect x="929" y="199" width="14" height="16"/>
      <rect x="905" y="199" width="14" height="16"/>
      <rect x="881" y="199" width="14" height="16"/>
      <rect x="857" y="199" width="14" height="16"/>
      <rect x="833" y="199" width="14" height="16"/>
    </g>
    <text x="625" y="413" text-anchor="middle" fill="#ff4d4d" font-size="34" font-weight="500">Slow Inbox at peak load</text>
  </g>
  <g class="fragment custom intercom-capacity" data-fragment-index="0" font-family="Inter,Arial,sans-serif">
    <g class="intercom-next-labels">
    <text x="611" y="164" text-anchor="middle" fill="#fafafa" font-size="29" font-weight="500">Database replicas</text>
    <text x="611" y="56" text-anchor="middle" fill="#a5a5a5" font-size="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">More capacity</text>
    <text x="1107" y="164" text-anchor="middle" fill="#fafafa" font-size="30" font-weight="500">EBS io2</text>
    <text x="876" y="145" text-anchor="middle" fill="#a5a5a5" font-size="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">More IOPS</text>
    <text x="625" y="413" text-anchor="middle" font-size="34" font-weight="500"><tspan fill="#fafafa">More headroom</tspan><tspan fill="#777777"> → </tspan><tspan fill="#ff4d4d">Higher cost</tspan></text>
    </g>
  </g>
</svg>
