:root{--ink:#111111;--white:#fafafa;--orange:#f35815;--muted:#a5a5a5;--line:#414141;--yellow:#fbca00;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--white);font-family:Inter,Arial,sans-serif}
.reveal{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:400;color:var(--white)}
.reveal .slides{text-align:left}
.reveal .slides>section{height:810px;padding:60px 64px;overflow:hidden}
.slide-content{position:absolute;top:50%;left:64px;right:64px;transform:translateY(-50%)}
.reveal h1,.reveal h2,.reveal h3,.reveal p{margin:0;font-weight:400}
.reveal h1{font-size:88px;font-weight:500;line-height:1.06;letter-spacing:-4.8px}
.reveal h2{font-size:56px;font-weight:500;line-height:1.1;letter-spacing:-2.4px}
.reveal h3{font:500 25px/1.3 var(--mono);letter-spacing:-1px}
.reveal p{line-height:1.45}.reveal strong{font-weight:500}
.reveal img{margin:0;max-width:none;max-height:none}
.reveal svg{display:block;width:100%;height:auto;overflow:visible}
.reveal .progress{height:2px;color:var(--orange)}
.accent{color:var(--orange)}.yellow{color:var(--yellow)}

/* Opening hero: a single brand lockup and product title. */
.reveal .slides>.opening{padding:60px 64px}
.opening-hero{height:690px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-brand{width:360px;margin-bottom:46px;flex-shrink:0}
.cover-brand img{display:block;width:100%;height:auto}
.reveal .opening h1{font-size:112px;font-weight:500;line-height:1.08;letter-spacing:-5.2px;white-space:nowrap}

/* Presentation UI is outside the slide canvas. */
.deck-tools{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 9px;background:rgba(30,30,30,.98);border:1px solid #454545;border-radius:8px;z-index:20;color:#ddd;font-size:12px;opacity:.13;transition:opacity .15s}
.deck-tools:hover,.deck-tools:focus-within{opacity:1}
.deck-tools button{background:transparent;border:0;color:#e1e1e1;font:12px Inter;cursor:pointer;padding:7px 9px;border-radius:4px}
.deck-tools button:hover{background:#424242}.deck-tools button:disabled{opacity:.3;cursor:default}
.deck-tools #position{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}
.tool-divider{width:1px;height:16px;background:#555;margin:0 4px}
button:focus-visible,a:focus-visible{outline:3px solid #74b9ef;outline-offset:4px}
.deck-tools #previous,.deck-tools #next{font-size:18px}
dialog{color:#fafafa;background:#222;border:1px solid #555;max-width:490px;padding:30px;border-radius:8px;font:16px Inter;z-index:50}
dialog::backdrop{background:#000b}dialog h2{font-size:25px;font-weight:500;margin-top:0}
dialog p{line-height:1.6}dialog .small{font-size:14px;color:#bbb}dialog a{color:#8bb9da}
dialog button{padding:10px 20px;background:#f35815;color:white;border:0;font:15px Inter;cursor:pointer}
#notes-dialog{width:calc(100vw - 32px);max-width:720px;max-height:calc(100dvh - 48px);box-sizing:border-box;overflow:hidden}
#notes-dialog[open]{display:flex;flex-direction:column;gap:18px}#notes-dialog h2{margin:0;flex-shrink:0}#notes-dialog button{align-self:flex-start;flex-shrink:0}
#notes-content{font-size:17px;line-height:1.65;max-height:60vh;min-height:0;overflow:auto;white-space:normal}
.speaker-outline{margin:0;padding-left:1.3em}.speaker-outline li+li{margin-top:12px}
.presentation-mode .deck-tools{display:none!important}
.capture .deck-tools,.capture .progress{display:none!important}
.capture .reveal{-webkit-user-select:none;user-select:none}.capture ::selection{background:transparent;color:inherit}
@media(max-width:700px){.deck-tools{gap:0;white-space:nowrap}.deck-tools button{padding:7px}.deck-tools #help{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.deck-tools,dialog{display:none!important}.reveal .slides>section{overflow:hidden!important}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style><style>/* Reveal owns navigation. The runtime owns SVG geometry and labels. */
.ps-diagram{position:relative}
.ps-diagram h2{min-height:1.15em;font-size:54px!important;line-height:1.15!important}
.ps-diagram svg{margin-top:32px;overflow:visible}
.ps-diagram svg text{font-family:var(--mono,ui-monospace,Menlo,monospace)}
.ps-diagram [data-kind="container"] text,.ps-diagram [data-kind="storage"] text{font-family:Inter,Arial,sans-serif}
.reveal .ps-diagram .ps-diagram-step{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;transition:none!important}
.ps-diagram svg [data-node],.ps-diagram svg [data-link]{transition:none}
@media(prefers-reduced-motion:reduce){.ps-diagram *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="reveal"><div class="slides" id="slides"></div></div>
  <nav class="deck-tools" aria-label="Presentation controls">
    <button id="previous" aria-label="Previous slide">←</button><span id="position" aria-live="polite">01 / 10</span><button id="next" aria-label="Next slide">→</button>
    <span class="tool-divider"></span><button id="overview" title="Slide overview (O)">Overview</button><button id="fullscreen" title="Fullscreen (F)">Fullscreen</button><button id="help" title="Keyboard shortcuts">?</button>
  </nav>
  <dialog id="help-dialog"><h2>Ready to present</h2><p>← / → &nbsp; Previous / next slide</p><p>O or Esc &nbsp; Slide overview</p><p></p><p>F &nbsp; Fullscreen</p><p>B &nbsp; Pause on a black screen</p><p class="small">For speaker view, serve this folder locally. For a PDF, open <a href="?print-pdf">print layout</a> and print in landscape with background graphics enabled.</p><button id="close-help">Back to deck</button></dialog>

</script><script>const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const renderNotes = value => `<ul class="speaker-outline">${value.split('\n').filter(Boolean).map(point => `<li>${escapeHtml(point.replace(/^•\s*/,''))}</li>`).join('')}</ul>`;
const slideOptions = new URLSearchParams(location.search);
const slides = window.PITCH_SLIDES;
const hasNotes = slides.some(slide => Boolean(slide.notes));
if(!hasNotes){document.getElementById('notes')?.remove();document.getElementById('notes-dialog')?.remove();document.querySelector('#help-dialog').innerHTML = document.querySelector('#help-dialog').innerHTML.replace('S &nbsp; Speaker view with notes and timer','');}
if(slideOptions.has('present'))document.body.classList.add('presentation-mode');
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
document.getElementById('slides').innerHTML = slides.map(slide => `<section id="${slide.id}" class="${slide.theme}" data-background-color="#111111"><div class="slide-content">${slide.html}</div>${hasNotes ? `<aside class="notes">${renderNotes(slide.notes || '')}</aside>` : ''}</section>`).join('');

const deck = new Reveal({width:1440,height:810,margin:0.06,center:false,view:'slide',scrollActivationWidth:0,hash:true,controls:false,progress:true,transition:'none',backgroundTransition:'none',slideNumber:false,help:false,plugins:[PlanetScaleDiagrams.createPlugin(), ...(hasNotes ? [RevealNotes] : [])],pdfSeparateFragments:false,pdfMaxPagesPerSlide:1,keyboard:{79:()=>deck.toggleOverview()},disableLayout:false});
deck.initialize().then(updatePosition);
function updatePosition(){const i=deck.getIndices().h;document.getElementById('position').textContent=`${String(i+1).padStart(2,'0')} / ${slides.length}`;const f=deck.availableFragments();document.getElementById('previous').disabled=i===0&&!f.prev;document.getElementById('next').disabled=i===slides.length-1&&!f.next;}
deck.on('slidechanged',updatePosition);
document.getElementById('previous').onclick=()=>deck.prev();
document.getElementById('next').onclick=()=>deck.next();
document.getElementById('overview').onclick=()=>deck.toggleOverview();
const notesDialog=document.getElementById('notes-dialog');
if(hasNotes){
document.getElementById('notes').onclick=()=>{const i=deck.getIndices().h;document.getElementById('notes-title').textContent=`Slide ${i+1} · ${slides[i].label}`;document.getElementById('notes-content').innerHTML=renderNotes(slides[i].notes);deck.configure({keyboard:false});notesDialog.showModal();};
document.getElementById('close-notes').onclick=()=>notesDialog.close();
notesDialog.addEventListener('close',()=>deck.configure({keyboard:{79:()=>deck.toggleOverview()}}));
}
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
const help=document.getElementById('help-dialog');
document.getElementById('help').onclick=()=>{deck.configure({keyboard:false});help.showModal();};
document.getElementById('close-help').onclick=()=>help.close();
help.addEventListener('close',()=>deck.configure({keyboard:{79:()=>deck.toggleOverview()}}));
