:root{--ink:#111111;--white:#fafafa;--orange:#f35815;--muted:#a5a5a5;--line:#414141;--yellow:#fbca00;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--white);font-family:Inter,Arial,sans-serif}
.reveal{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:400;color:var(--white)}
.reveal .slides{text-align:left}
.reveal .slides>section{height:810px;padding:60px 64px;overflow:hidden}
.slide-content{position:absolute;top:50%;left:64px;right:64px;transform:translateY(-50%)}
.reveal h1,.reveal h2,.reveal h3,.reveal p{margin:0;font-weight:400}
.reveal h1{font-size:88px;font-weight:500;line-height:1.06;letter-spacing:-4.8px}
.reveal h2{font-size:56px;font-weight:500;line-height:1.1;letter-spacing:-2.4px}
.reveal h3{font:500 25px/1.3 var(--mono);letter-spacing:-1px}
.reveal p{line-height:1.45}.reveal strong{font-weight:500}
.reveal img{margin:0;max-width:none;max-height:none}
.reveal svg{display:block;width:100%;height:auto;overflow:visible}
.reveal .progress{height:2px;color:var(--orange)}
.accent{color:var(--orange)}.yellow{color:var(--yellow)}

/* Opening hero: a single brand lockup and product title. */
.reveal .slides>.opening{padding:60px 64px}
.opening-hero{height:690px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-brand{width:360px;margin-bottom:46px;flex-shrink:0}
.cover-brand img{display:block;width:100%;height:auto}
.reveal .opening h1{font-size:112px;font-weight:500;line-height:1.08;letter-spacing:-5.2px;white-space:nowrap}

/* Presentation UI is outside the slide canvas. */
.deck-tools{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 9px;background:rgba(30,30,30,.98);border:1px solid #454545;border-radius:8px;z-index:20;color:#ddd;font-size:12px;opacity:.13;transition:opacity .15s}
.deck-tools:hover,.deck-tools:focus-within{opacity:1}
.deck-tools button{background:transparent;border:0;color:#e1e1e1;font:12px Inter;cursor:pointer;padding:7px 9px;border-radius:4px}
.deck-tools button:hover{background:#424242}.deck-tools button:disabled{opacity:.3;cursor:default}
.deck-tools #position{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}
.tool-divider{width:1px;height:16px;background:#555;margin:0 4px}
button:focus-visible,a:focus-visible{outline:3px solid #74b9ef;outline-offset:4px}
.deck-tools #previous,.deck-tools #next{font-size:18px}
dialog{color:#fafafa;background:#222;border:1px solid #555;max-width:490px;padding:30px;border-radius:8px;font:16px Inter;z-index:50}
dialog::backdrop{background:#000b}dialog h2{font-size:25px;font-weight:500;margin-top:0}
dialog p{line-height:1.6}dialog .small{font-size:14px;color:#bbb}dialog a{color:#8bb9da}
dialog button{padding:10px 20px;background:#f35815;color:white;border:0;font:15px Inter;cursor:pointer}
#notes-dialog{width:calc(100vw - 32px);max-width:720px;max-height:calc(100dvh - 48px);box-sizing:border-box;overflow:hidden}
#notes-dialog[open]{display:flex;flex-direction:column;gap:18px}#notes-dialog h2{margin:0;flex-shrink:0}#notes-dialog button{align-self:flex-start;flex-shrink:0}
#notes-content{font-size:17px;line-height:1.65;max-height:60vh;min-height:0;overflow:auto;white-space:normal}
.speaker-outline{margin:0;padding-left:1.3em}.speaker-outline li+li{margin-top:12px}
.presentation-mode .deck-tools{display:none!important}
.capture .deck-tools,.capture .progress{display:none!important}
.capture .reveal{-webkit-user-select:none;user-select:none}.capture ::selection{background:transparent;color:inherit}
@media(max-width:700px){.deck-tools{gap:0;white-space:nowrap}.deck-tools button{padding:7px}.deck-tools #help{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.deck-tools,dialog{display:none!important}.reveal .slides>section{overflow:hidden!important}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Aurora-focused teach-back: the explanation lives in the art, not footnotes. */
.reveal .teach h2{font-size:56px;line-height:1.12;letter-spacing:-2.4px}
.teach-cloud .ps-diagram svg{height:470px;margin-top:28px}
.teach-comparison .metal-comparison{height:595px;width:100%;margin:25px auto 0}
.reveal .fragment.latency-reveal{opacity:0;visibility:hidden;transform:translateY(7px);transition:opacity 300ms ease,transform 300ms ease,visibility 300ms}
.reveal .fragment.latency-reveal.visible{opacity:1;visibility:visible;transform:translateY(0)}
.teach-capacity .ps-diagram svg{height:285px;margin-top:28px}
.capacity-table{width:100%;border-collapse:collapse;margin-top:26px;font-size:23px;line-height:1.35;table-layout:fixed}
.capacity-table th,.capacity-table td{padding:19px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:400;vertical-align:top}
.capacity-table th:first-child{width:24%;font:21px/1.4 var(--mono);color:var(--muted)}
.capacity-table th:nth-child(2),.capacity-table td:nth-child(2){width:35%;color:var(--orange)}
.capacity-table th:last-child,.capacity-table td:last-child{padding-left:24px}
.capacity-table thead{display:none}
.teach-cover .opening-hero{height:690px;flex-direction:row;gap:28px}
.teach-cover .cover-brand{width:540px;margin-bottom:0}
.reveal .teach-cover h1{font-size:100px;letter-spacing:-4.5px}

/* Depot: original customer evidence, large results, and an expanding history schematic. */
.reveal .depot-scope{font:22px/1.4 var(--mono);color:var(--muted);margin-top:20px}
.depot-evidence{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:42px;margin-top:34px;align-items:start}
.depot-cpu-proof{margin:0;min-width:0}
.depot-cpu-proof figcaption{display:flex;justify-content:space-between;font:25px/1.3 var(--mono);margin-bottom:18px}
.reveal .depot-cpu-image{display:block;width:100%;height:auto;aspect-ratio:720/202;object-fit:contain;filter:invert(.93) hue-rotate(180deg)}
.depot-insight{display:flex;align-items:center;gap:18px;font:28px/1.3 var(--mono);color:var(--orange);margin-top:20px}
.insight-rule{display:block;width:44px;height:2px;background:var(--orange)}
.depot-percentiles{border-left:1px solid var(--line);padding-left:30px}
.reveal .depot-percentile p{font:24px/1.3 var(--mono);color:var(--muted)}
.percentile-values{display:flex;gap:14px;align-items:baseline;font-size:57px;letter-spacing:-2px;white-space:nowrap;margin-top:12px}
.metric-arrow{font-size:32px;color:var(--muted)}.metric-unit{font-size:26px;letter-spacing:0}
.percentile-gain{font-size:32px;letter-spacing:-.8px;margin-top:7px}
.depot-percentile+.depot-percentile{margin-top:26px}
.percentile-values.secondary{font-size:43px;letter-spacing:-1.6px}
.depot-history{display:grid;grid-template-columns:1.12fr 1fr;gap:30px;align-items:center;margin-top:26px;padding-top:25px;border-top:1px solid var(--line)}
.reveal .retention-label{font:22px/1.3 var(--mono);color:var(--muted)}
.history-words{position:relative;height:49px;margin-top:12px;font-size:36px;line-height:1.3;letter-spacing:-1.3px;white-space:nowrap}
.history-before,.history-after{position:absolute;left:0;top:0}
.reveal .history-benefit{font-size:26px;line-height:1.35;margin-top:9px}
.reveal .depot-history-art{width:100%;height:133px}
.reveal .history-extension{transform-origin:190px 72px;transition:opacity 380ms ease,visibility 380ms ease}

/* Aurora: current system, persistent path, and explicitly scoped measured query evidence. */
.aurora-measured-proof{display:flex;align-items:baseline;justify-content:space-between;gap:30px;margin-top:14px;padding-top:21px;border-top:1px solid var(--line)}
.aurora-workload{font:24px/1.3 var(--mono);color:var(--muted)}
.aurora-query-metric{font-size:30px;white-space:nowrap;letter-spacing:-1px}
.aurora-query-metric strong{font-size:36px;color:var(--orange);font-weight:500;margin-left:15px}

/* Exact benchmark-slide treatment from the Postgres pitch. */
.metal-heading{display:flex;justify-content:flex-start;align-items:center}
.metal-heading h2{display:flex;align-items:center;gap:16px;white-space:nowrap}
.metal-title-brand{display:inline-flex;align-items:center;gap:14px}
.metal-title-symbol{display:block;width:46px;height:46px;overflow:hidden;flex-shrink:0}
.metal-title-symbol img{display:block;width:287.055px;height:46px;max-width:none}
.benchmark-grid{display:grid;grid-template-columns:1fr 1.08fr;gap:64px;margin-top:52px}
.benchmark-grid>div{position:relative}
.benchmark-grid h3{margin-bottom:20px}
.benchmark-grid h3 span{display:block;font-size:16px;color:#969696;font-weight:400;margin-top:7px;letter-spacing:0}
.benchmark-grid svg{height:505px}
.benchmark-grid>div:first-child svg{height:440px;margin-top:32px}
.chart-legend{position:absolute;top:54px;left:0;right:0;display:flex;justify-content:center;gap:16px;font:16px var(--mono);z-index:1}
.chart-legend span:before{content:'';display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:8px;background:#c4c4c4}
.chart-legend .ps-dot:before{background:var(--orange)}
.chart-legend .alloydb-dot:before{background:#91abc7}
.chart-legend .supabase-dot:before{background:#88b8a0}

/* Tradeoffs: direct comparison, with capacity obligations as visible as I/O benefits. */
.tradeoffs-table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:32px;line-height:1.22}
.tradeoffs-table .tradeoff-dimension{width:21%}
.tradeoffs-table th,.tradeoffs-table td{text-align:left;vertical-align:top;font-weight:400;padding:20px 26px;border-bottom:1px solid var(--line)}
.tradeoffs-table th:first-child{padding-left:0}
.tradeoffs-table td:last-child,.tradeoffs-table th:last-child{padding-right:0}
.tradeoffs-table thead th{font-size:31px;font-weight:500;padding-top:0;padding-bottom:22px}
.tradeoffs-table thead th:first-child{font:22px/1.4 var(--mono);color:var(--muted);padding-top:5px}
.tradeoffs-table thead th:nth-child(2){color:var(--orange)}
.tradeoffs-table thead span{display:block;font:20px/1.4 var(--mono);color:var(--muted);margin-top:8px}
.tradeoffs-table tbody th{font:22px/1.4 var(--mono);color:var(--muted);padding-top:25px}
.tradeoffs-table td strong{display:block;font-size:27px;font-weight:500;letter-spacing:-.5px}
.tradeoffs-table td span{display:block;font-size:21px;color:var(--muted);margin-top:8px;line-height:1.35}

/* Convex case study copied exactly from the Postgres pitch. */
.case-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;height:74px}
.case-heading h2{font-size:53px;white-space:nowrap}
.case-heading img{object-fit:contain;flex-shrink:0}
.convex-brand{display:flex;align-items:center;width:245px;flex-shrink:0;margin-right:-24px}
.convex-symbol{width:82px;height:84px;margin-right:-27px!important}
.convex-wordmark{width:210px;height:95px}
.convex-curves{margin-top:32px}
.convex-original-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.source-provider-row{display:flex;justify-content:space-around;font:18px var(--mono);margin-bottom:21px;color:#bcbcbc}
.source-provider-row span:last-child{color:var(--orange)}
.convex-source-frame{position:relative;aspect-ratio:1488/660;overflow:hidden}
.convex-source-frame img{display:block;width:100%;height:auto;filter:invert(.93) hue-rotate(180deg) brightness(1.7) contrast(1.12)}
.commit-source img{transform:translateY(-50.752%)}
.convex-result{margin:0;padding:32px 0;border:0;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:18px;transform:translateY(18px)}
.convex-result>span{font:21px var(--mono);color:#aaa}
.convex-result>div{margin-top:0;font:30px/1.2 var(--mono);white-space:nowrap}
.convex-result i{font-style:normal;color:#777;margin:0 10px}
.convex-result strong{color:var(--orange);font-size:38px}
.convex-heading{justify-content:flex-start;gap:34px;align-items:center}
.convex-heading h2{font-size:52px;line-height:1.1}
.convex-heading .convex-brand{margin-left:-18px;margin-right:0;width:278px;transform:translateY(5px)}
.convex-heading .convex-wordmark{width:252px;height:114px}
.convex-quote{display:flex;align-items:baseline;gap:24px;margin-top:42px}
.convex-quote q{font-size:30px;letter-spacing:-.6px;color:#fafafa}
.convex-quote>span{font:17px var(--mono);color:#999}
.convex-heading{gap:14px}
.convex-heading .convex-title-symbol{width:82px;height:84px;object-fit:contain;margin-left:-15px}
.convex-heading h2{font-family:Inter,Arial,sans-serif;font-size:52px}
.convex-quote{justify-content:center;text-align:center}
.convex-heading h2{font-size:44px;letter-spacing:-1.9px}
.convex-quote{border:0;padding:0;margin-top:0;background:none;gap:20px;transform:translateY(18px)}
.convex-quote q{background:none;padding:0}
.convex-quote>span{background:none;padding:0}

.ps-diagram{position:relative}

.ps-diagram svg{margin-top:32px;overflow:visible}
.ps-diagram svg text{font-family:var(--mono,ui-monospace,Menlo,monospace)}
.ps-diagram [data-kind="container"] text,.ps-diagram [data-kind="storage"] text{font-family:Inter,Arial,sans-serif}
.reveal .ps-diagram .ps-diagram-step{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;transition:none!important}
.ps-diagram svg [data-node],.ps-diagram svg [data-link]{transition:none}

    "label": "EBS reference versus Metal: storage access latency",

    "html": "<h2>What is <span class=\"accent\">Metal?</span></h2>\n<svg class=\"metal-comparison\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1250 635\" role=\"img\" aria-label=\"EBS io2 and gp3 storage reference versus PlanetScale Metal local NVMe mechanism. Visible io2 approximately 400 microseconds and gp3 approximately 1 millisecond are illustrative reference values, not AWS published universal averages. AWS specifies io2 below 500 microseconds for 16 KiB I/O and gp3 single-digit milliseconds. These are storage I/O figures, not isolated network-hop latency. The approximately 50 microsecond local NVMe value is PlanetScale’s educational storage round-trip example, not a measured Metal mean. These are different evidence bases, not a controlled benchmark or Aurora latency. Query p95/p99 are separate metrics. Memory/cache hits, replication and application networking are omitted.\">\n  <defs>\n    <pattern id=\"teach-metal-host-dots\" width=\"7\" height=\"7\" patternUnits=\"userSpaceOnUse\"><rect x=\"1\" y=\"1\" width=\"1.2\" height=\"2\" fill=\"#f35815\"/><rect x=\"4.5\" y=\"4.5\" width=\"1.2\" height=\"2\" fill=\"#f35815\"/></pattern>\n    <marker id=\"teach-metal-remote-arrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\"><path d=\"M0 0L7 3.5L0 7Z\" fill=\"#a5a5a5\"/></marker>\n    <marker id=\"teach-metal-local-arrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\"><path d=\"M0 0L7 3.5L0 7Z\" fill=\"#f35815\"/></marker>\n    <linearGradient id=\"teach-metal-drive-fill\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop stop-color=\"#f35815\" stop-opacity=\".16\"/><stop offset=\"1\" stop-color=\"#f35815\" stop-opacity=\".03\"/></linearGradient>\n  </defs>\n\n  <g font-family=\"Inter,Arial,sans-serif\" fill=\"#fafafa\">\n    <text x=\"0\" y=\"30\" font-size=\"28\" font-weight=\"500\">AWS EBS</text>\n    <g transform=\"translate(652 2) scale(.077)\" fill=\"#fafafa\"><path d=\"m0 227c.00001067-125.369 101. </script><script>const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const renderNotes = value => `<ul class="speaker-outline">${value.split('\n').filter(Boolean).map(point => `<li>${escapeHtml(point.replace(/^•\s*/,''))}</li>`).join('')}</ul>`;
const slideOptions = new URLSearchParams(location.search);
const slides = window.PITCH_SLIDES;
const hasNotes = slides.some(slide => Boolean(slide.notes));
if(!hasNotes){document.getElementById('notes')?.remove();document.getElementById('notes-dialog')?.remove();document.querySelector('#help-dialog').innerHTML = document.querySelector('#help-dialog').innerHTML.replace('S &nbsp; Speaker view with notes and timer','');}
if(slideOptions.has('present'))document.body.classList.add('presentation-mode');
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
document.getElementById('slides').innerHTML = slides.map(slide => `<section id="${slide.id}" class="${slide.theme}" data-background-color="#111111"><div class="slide-content">${slide.html}</div>${hasNotes ? `<aside class="notes">${renderNotes(slide.notes || '')}</aside>` : ''}</section>`).join('');

const deck = new Reveal({width:1440,height:810,margin:0.06,center:false,view:'slide',scrollActivationWidth:0,hash:true,controls:false,progress:true,transition:'none',backgroundTransition:'none',slideNumber:false,help:false,plugins:[PlanetScaleDiagrams.createPlugin(), ...(hasNotes ? [RevealNotes] : [])],pdfSeparateFragments:false,pdfMaxPagesPerSlide:1,keyboard:{79:()=>deck.toggleOverview()},disableLayout:false});
deck.initialize().then(updatePosition);
function updatePosition(){const i=deck.getIndices().h;document.getElementById('position').textContent=`${String(i+1).padStart(2,'0')} / ${slides.length}`;const f=deck.availableFragments();document.getElementById('previous').disabled=i===0&&!f.prev;document.getElementById('next').disabled=i===slides.length-1&&!f.next;}
deck.on('slidechanged',updatePosition);
document.getElementById('previous').onclick=()=>deck.prev();
document.getElementById('next').onclick=()=>deck.next();
document.getElementById('overview').onclick=()=>deck.toggleOverview();
const notesDialog=document.getElementById('notes-dialog');
if(hasNotes){
document.getElementById('notes').onclick=()=>{const i=deck.getIndices().h;document.getElementById('notes-title').textContent=`Slide ${i+1} · ${slides[i].label}`;document.getElementById('notes-content').innerHTML=renderNotes(slides[i].notes);deck.configure({keyboard:false});notesDialog.showModal();};
document.getElementById('close-notes').onclick=()=>notesDialog.close();
notesDialog.addEventListener('close',()=>deck.configure({keyboard:{79:()=>deck.toggleOverview()}}));
}
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
const help=document.getElementById('help-dialog');
document.getElementById('help').onclick=()=>{deck.configure({keyboard:false});help.showModal();};
document.getElementById('close-help').onclick=()=>help.close();
help.addEventListener('close',()=>deck.configure({keyboard:{79:()=>deck.toggleOverview()}}));
