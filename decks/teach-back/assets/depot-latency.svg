<svg class="depot-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 230" role="img" aria-labelledby="depot-latency-title depot-latency-desc"><title id="depot-latency-title">Depot query latency before and after Metal</title><desc id="depot-latency-desc">Customer-reported Vitess/MySQL results, March 11 2025. p95 falls from 40 to 5 milliseconds; p99 falls from 50 to 30 milliseconds. Both panels use the same linear bar scale of 7.2 SVG units per millisecond. Before: PlanetScale EBS-backed PS-400, 8 CPUs. After: Metal M-320, 4 CPUs. This is not an Aurora PostgreSQL migration or a controlled storage-only test.</desc>
<g transform="translate(0 0)" font-family="ui-monospace,monospace"><text x="0" y="35" fill="#fafafa" font-size="29">p95 query latency</text><text x="0" y="102" fill="#a5a5a5" font-size="23">Before</text><rect x="110" y="80" width="288.0" height="32" fill="#626262"/><text x="410.0" y="105" fill="#fafafa" font-size="27">40 ms</text><g class="fragment" data-fragment-index="0"><text x="0" y="172" fill="#f35815" font-size="23">Metal</text><rect x="110" y="150" width="36.0" height="32" fill="#f35815"/><text x="158.0" y="175" fill="#f35815" font-size="27">5 ms</text></g></g>
<g transform="translate(665 0)" font-family="ui-monospace,monospace"><text x="0" y="35" fill="#fafafa" font-size="29">p99 query latency</text><text x="0" y="102" fill="#a5a5a5" font-size="23">Before</text><rect x="110" y="80" width="360.0" height="32" fill="#626262"/><text x="482.0" y="105" fill="#fafafa" font-size="27">50 ms</text><g class="fragment" data-fragment-index="0"><text x="0" y="172" fill="#f35815" font-size="23">Metal</text><rect x="110" y="150" width="216.0" height="32" fill="#f35815"/><text x="338.0" y="175" fill="#f35815" font-size="27">30 ms</text></g></g>
</svg>
